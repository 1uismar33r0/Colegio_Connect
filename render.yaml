previews:
  generation: off

services:
  - type: web
    name: colegio-connect
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: '10000'
      - key: APP_REGISTRATION_ENABLED
        value: 'false'
      - key: DATABASE_URL
        fromDatabase:
          name: colegio-connect-db
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: colegio-connect-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: colegio-connect-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: colegio-connect-db
          property: password

databases:
  - name: colegio-connect-db
    databaseName: colegio_connect
    user: colegio_connect
    plan: free
    region: oregon
    postgresMajorVersion: '18'
    ipAllowList: []
