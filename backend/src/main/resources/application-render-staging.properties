# Render Free staging profile. The normal Compose and local default remain unchanged.
server.port=${PORT:10000}
server.address=0.0.0.0
server.forward-headers-strategy=framework
app.registration.enabled=${APP_REGISTRATION_ENABLED:false}
app.registration.allowed-email=${APP_REGISTRATION_ALLOWED_EMAIL:}
app.mail.provider=${APP_MAIL_PROVIDER:smtp}
app.mail.from=${APP_MAIL_FROM:}
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
server.tomcat.threads.max=20
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.error.include-stacktrace=never
# This app has a custom session authentication flow; Spring's unused generated
# development password must not be logged in public staging.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
