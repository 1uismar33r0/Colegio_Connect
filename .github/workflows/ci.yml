name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Verify backend
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build backend image
        run: docker build --tag colegio-connect:${{ github.sha }} backend

      - name: Save backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker image save --output colegio-connect-image.tar colegio-connect:${{ github.sha }}

      - name: Upload backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: colegio-connect-image-${{ github.sha }}
          path: colegio-connect-image.tar
          if-no-files-found: error
          retention-days: 7

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - backend
      - frontend
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required jobs succeeded
        if: needs.backend.result == 'success' && needs.frontend.result == 'success' && needs.container.result == 'success'
        run: echo "All required CI jobs succeeded."

      - name: Fail when a required job did not succeed
        if: needs.backend.result != 'success' || needs.frontend.result != 'success' || needs.container.result != 'success'
        run: exit 1
