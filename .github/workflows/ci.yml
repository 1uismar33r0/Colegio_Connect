name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Verify backend
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build backend image
        run: docker build --tag colegio-connect:${{ github.sha }} backend

      - name: Save backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker image save --output colegio-connect-image.tar colegio-connect:${{ github.sha }}

      - name: Upload backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: colegio-connect-image-${{ github.sha }}
          path: colegio-connect-image.tar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check generated API types match the committed spec
        run: npm run api:gen && git diff --exit-code -- src/api/schema.d.ts

      - name: Build
        run: npm run build

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - backend
      - container
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required jobs succeeded
        if: needs.backend.result == 'success' && needs.container.result == 'success' && needs.frontend.result == 'success'
        run: echo "All required CI jobs succeeded."

      - name: Fail when a required job did not succeed
        if: needs.backend.result != 'success' || needs.container.result != 'success' || needs.frontend.result != 'success'
        run: exit 1
